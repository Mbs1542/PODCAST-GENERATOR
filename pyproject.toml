[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-podcast-generator"
version = "3.6.0"
description = "Automated pipeline that converts Azure lectures into bilingual podcasts with visuals."
authors = [{ name = "Azure Podcast Generator", email = "maorbensimon1542@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "azure-cognitiveservices-speech>=1.38.0",
    "openai>=1.51.0",
    "pydub>=0.25.1",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "moviepy>=1.0.3,<2",  # the code imports moviepy.editor, removed in 2.0
    "manim>=0.18.0",
    "langdetect>=1.0.9",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "opencv-python-headless>=4.8.0",
    "psutil>=5.9.0",
    "tiktoken>=0.7.0",
    "jsonschema>=4.21.1",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.32.0",
    "google-genai>=0.5.0",
    "elevenlabs>=1.0.0",
    "numpy",
    "scipy",
    "pillow",
    "sounddevice",
    "arabic-reshaper",
    "python-bidi"
]

[project.optional-dependencies]
desktop = ["PyQt6>=6.7.0", "pyqtgraph>=0.13.3"]  # legacy src/gui; the default UI is python -m src.web
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.12.0",
    "black>=24.3.0",
    "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

